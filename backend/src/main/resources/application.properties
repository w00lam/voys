spring.application.name=voys-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:500MB}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

voys.storage.root=${VOYS_STORAGE_ROOT:storage/audio}
voys.frontend.origin=${VOYS_FRONTEND_ORIGIN:http://localhost:5173}
voys.recording.max-upload-bytes=${VOYS_RECORDING_MAX_UPLOAD_BYTES:524288000}
