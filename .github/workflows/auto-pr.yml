name: Auto PR

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Open or update PR
    runs-on: ubuntu-latest

    steps:
      - name: Open or update pull request
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';
            const issueLabel = 'auto-pr';
            const branchLabel = `branch:${head}`;
            const issueMatch = head.match(/^(feature|fix|chore|docs|refactor|test)\/(\d+)[-_\/].+/);
            const linkedIssueNumber = issueMatch ? Number(issueMatch[2]) : null;
            const branchType = head.split('/')[0];
            const readableTitle = head
              .replace(/^(feature|fix|chore|docs|refactor|test)\//, '')
              .replace(/^\d+[-_\/]/, '')
              .replace(/[-_]+/g, ' ')
              .replace(/\b\w/g, (char) => char.toUpperCase());
            const typeLabels = {
              feature: 'Feature',
              fix: 'Fix',
              chore: 'Chore',
              docs: 'Docs',
              refactor: 'Refactor',
              test: 'Test',
            };
            const generatedTitle = `${typeLabels[branchType] || 'Work'}: ${readableTitle}`;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            await ensureLabel(issueLabel, '6f42c1', 'Created or managed by the automatic PR workflow');
            await ensureLabel(branchLabel, 'bfd4f2', `Tracks work for ${head}`);

            let issue;
            if (linkedIssueNumber) {
              const existingIssue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: linkedIssueNumber,
              });
              issue = existingIssue.data;

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: linkedIssueNumber,
                labels: [issueLabel, branchLabel],
              });
            } else {
              const issues = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: branchLabel,
                per_page: 10,
              });
              issue = issues.data.find((item) => !item.pull_request);
            }

            if (!issue || issue.pull_request) {
              const createdIssue = await github.rest.issues.create({
                owner,
                repo,
                title: generatedTitle,
                labels: [issueLabel, branchLabel],
                body: [
                  '## Goal',
                  '',
                  `Track work for branch \`${head}\`.`,
                  '',
                  linkedIssueNumber
                    ? `Branch references issue #${linkedIssueNumber}, but it could not be used directly; this fallback issue was created.`
                    : 'Branch name did not include an issue number, so this fallback tracking issue was created.',
                  '',
                  '## Checklist',
                  '',
                  '- [ ] Agent OS spec is linked or created when needed.',
                  '- [ ] Implementation follows project standards.',
                  '- [ ] Tests or manual validation are complete.',
                  '- [ ] PR review is complete before merge.',
                ].join('\n'),
              });
              issue = createdIssue.data;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
            });

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`,
              per_page: 100,
            });

            const commits = comparison.data.commits || [];
            const files = comparison.data.files || [];

            const commitList = commits
              .slice(-10)
              .map((commit) => {
                const message = commit.commit.message.split('\n')[0];
                const shortSha = commit.sha.slice(0, 7);
                return `- ${message} (${shortSha})`;
              })
              .join('\n');

            const fileList = files
              .slice(0, 30)
              .map((file) => `- \`${file.filename}\` (${file.status}, +${file.additions}/-${file.deletions})`)
              .join('\n');

            const hasBackend = files.some((file) => file.filename.startsWith('backend/'));
            const hasFrontend = files.some((file) => file.filename.startsWith('frontend/'));
            const hasWorkflow = files.some((file) => file.filename.startsWith('.github/workflows/'));
            const hasAgentSpec = files.some((file) => file.filename.startsWith('agent-os/specs/'));

            const validation = [];
            if (hasBackend) {
              validation.push('- Backend tests or CI Backend check.');
            }
            if (hasFrontend) {
              validation.push('- Frontend build/test or CI Frontend check.');
            }
            if (hasWorkflow) {
              validation.push('- GitHub Actions workflow syntax and follow-up Actions run.');
            }
            if (validation.length === 0) {
              validation.push('- Validation appropriate to this PR scope.');
            }

            const body = [
              '## Summary',
              '',
              `- ${issue.title}`,
              `- Branch: \`${head}\``,
              `- Closes #${issue.number}`,
              '',
              '## Changed Files',
              '',
              fileList || '- No changed files detected yet.',
              '',
              '## Commits',
              '',
              commitList || '- No commits detected yet.',
              '',
              '## Review Focus',
              '',
              hasAgentSpec
                ? '- Confirm the implementation matches the Agent OS spec.'
                : '- Confirm whether an Agent OS spec is unnecessary for this change.',
              hasWorkflow
                ? '- Confirm workflow permissions, triggers, and token usage are scoped correctly.'
                : '- Confirm the diff matches the linked issue scope.',
              '',
              '## Validation',
              '',
              validation.join('\n'),
              '',
              '## Notes',
              '',
              '- This PR body was generated by GitHub Actions.',
              '- Merge remains a manual or guarded automation decision.',
            ].join('\n');

            let pr;
            if (existing.data.length > 0) {
              pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title: generatedTitle,
                body,
              });
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title: generatedTitle,
                head,
                base,
                body,
                draft: true,
                maintainer_can_modify: true,
              });
              pr = created.data;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                issue.body || '',
                '',
                '## Links',
                '',
                `- Branch: \`${head}\``,
                `- PR: #${pr.number}`,
              ].join('\n'),
            });

            core.setOutput('number', pr.number);
            core.setOutput('url', pr.html_url);
            core.setOutput('issue_number', issue.number);
