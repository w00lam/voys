name: Auto PR

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Open or update PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or update pull request
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';
            const issueLabel = 'auto-pr';
            const branchLabel = `branch:${head}`;
            const issueMatch = head.match(/^(feature|fix|chore|docs|refactor|test)\/(\d+)[-_\/].+/);
            const linkedIssueNumber = issueMatch ? Number(issueMatch[2]) : null;
            const readableTitle = head
              .replace(/^(feature|fix|chore|docs|refactor|test)\//, '')
              .replace(/^\d+[-_\/]/, '')
              .replace(/[-_]+/g, ' ')
              .replace(/\b\w/g, (char) => char.toUpperCase());
            const branchType = head.split('/')[0];
            const typeLabels = {
              feature: '기능',
              fix: '수정',
              chore: '작업',
              docs: '문서',
              refactor: '리팩터링',
              test: '테스트',
            };
            const koreanType = typeLabels[branchType] || '작업';
            const generatedTitle = `${koreanType}: ${readableTitle}`;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              }
            }

            await ensureLabel(issueLabel, '6f42c1', 'Created or managed by the automatic PR workflow');
            await ensureLabel(branchLabel, 'bfd4f2', `Tracks work for ${head}`);

            let issue;
            if (linkedIssueNumber) {
              const existingIssue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: linkedIssueNumber,
              });
              issue = existingIssue.data;

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: linkedIssueNumber,
                labels: [issueLabel, branchLabel],
              });
            } else {
              const issues = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: branchLabel,
                per_page: 10,
              });

              issue = issues.data.find((item) => !item.pull_request);
            }

            if (!issue || issue.pull_request) {
              const createdIssue = await github.rest.issues.create({
                owner,
                repo,
                title: generatedTitle,
                labels: [issueLabel, branchLabel],
                body: [
                  '## 목표',
                  '',
                  `\`${head}\` 브랜치 작업을 추적합니다.`,
                  '',
                  linkedIssueNumber
                    ? `요청된 이슈 #${linkedIssueNumber}를 추적 이슈로 사용할 수 없어 fallback 이슈를 생성했습니다.`
                    : '브랜치명에 이슈 번호가 없어 자동으로 생성된 추적 이슈입니다.',
                  '',
                  '## 체크리스트',
                  '',
                  '- [ ] 필요한 경우 Agent OS spec이 연결되었거나 생성되었습니다.',
                  '- [ ] 구현이 프로젝트 standards를 따릅니다.',
                  '- [ ] 테스트 또는 수동 검증이 완료되었습니다.',
                  '- [ ] merge 전에 PR 리뷰가 완료되었습니다.',
                  '',
                  '## 링크',
                  '',
                  '- PR: 브랜치 push 이후 자동 생성됩니다.',
                ].join('\n'),
              });
              issue = createdIssue.data;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
            });

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`,
              per_page: 100,
            });

            const commitList = comparison.data.commits
              .slice(-10)
              .map((commit) => {
                const message = commit.commit.message.split('\n')[0];
                const shortSha = commit.sha.slice(0, 7);
                return `- ${message} (${shortSha})`;
              })
              .join('\n');

            const fileList = (comparison.data.files || [])
              .slice(0, 30)
              .map((file) => {
                const status = {
                  added: '추가',
                  modified: '수정',
                  removed: '삭제',
                  renamed: '이름 변경',
                }[file.status] || file.status;
                return `- \`${file.filename}\` (${status}, +${file.additions}/-${file.deletions})`;
              })
              .join('\n');

            const issueSummary = (issue.body || '')
              .split('\n')
              .map((line) => line.trim())
              .filter((line) => line && !line.startsWith('## ') && !line.startsWith('- [ ]'))
              .slice(0, 12)
              .join('\n');

            const workGoal = [
              `- ${readableTitle} 작업을 완료합니다.`,
              issueSummary ? `- 이슈 내용: ${issueSummary.replace(/\n/g, ' / ')}` : '',
            ].filter(Boolean).join('\n');

            const title = generatedTitle;
            const body = [
              '## 요약',
              '',
              `- ${issue.title}`,
              `- 브랜치: \`${head}\``,
              `- Closes #${issue.number}`,
              '',
              '## 작업 목표',
              '',
              workGoal,
              '',
              '## 변경 사항',
              '',
              fileList || '- 아직 감지된 변경 파일이 없습니다.',
              '',
              '## 커밋',
              '',
              commitList || '- 아직 감지된 커밋이 없습니다.',
              '',
              '## 검증',
              '',
              '- [ ] 백엔드 테스트 통과',
              '- [ ] 프론트엔드 빌드 통과',
              '- [ ] 필요한 수동 검증 완료',
              '',
              '## Agent OS',
              '',
              '- Spec:',
              '- Standards:',
              '',
              '## 메모',
              '',
              '- 이 PR은 GitHub Actions가 자동으로 열었습니다.',
              '- merge는 수동으로 진행합니다.',
            ].join('\n');

            let pr;
            if (existing.data.length > 0) {
              pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
                draft: true,
                maintainer_can_modify: true,
              });
              pr = created.data;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                '## 목표',
                '',
                `\`${head}\` 브랜치 작업을 추적합니다.`,
                '',
                linkedIssueNumber
                  ? `이 브랜치는 이슈 #${linkedIssueNumber}와 연결되어 있습니다.`
                  : '브랜치명에 이슈 번호가 없어 자동으로 생성된 추적 이슈입니다.',
                '',
                '## 체크리스트',
                '',
                '- [ ] 필요한 경우 Agent OS spec이 연결되었거나 생성되었습니다.',
                '- [ ] 구현이 프로젝트 standards를 따릅니다.',
                '- [ ] 테스트 또는 수동 검증이 완료되었습니다.',
                '- [ ] merge 전에 PR 리뷰가 완료되었습니다.',
                '',
                '## 링크',
                '',
                `- PR: #${pr.number}`,
              ].join('\n'),
            });

            core.setOutput('number', pr.number);
            core.setOutput('url', pr.html_url);
            core.setOutput('issue_number', issue.number);
