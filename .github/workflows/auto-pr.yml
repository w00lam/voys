name: Auto PR

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Open or update PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or update pull request
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';
            const issueLabel = 'auto-pr';
            const branchLabel = `branch:${head}`;
            const readableTitle = head
              .replace(/^(feature|fix|chore|docs|refactor|test)\//, '')
              .replace(/[-_]+/g, ' ')
              .replace(/\b\w/g, (char) => char.toUpperCase());

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              }
            }

            await ensureLabel(issueLabel, '6f42c1', 'Created or managed by the automatic PR workflow');
            await ensureLabel(branchLabel, 'bfd4f2', `Tracks work for ${head}`);

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: branchLabel,
              per_page: 10,
            });

            let issue = issues.data.find((item) => !item.pull_request);
            if (!issue) {
              const createdIssue = await github.rest.issues.create({
                owner,
                repo,
                title: readableTitle,
                labels: [issueLabel, branchLabel],
                body: [
                  '## Goal',
                  '',
                  `Track work for branch \`${head}\`.`,
                  '',
                  '## Checklist',
                  '',
                  '- [ ] Agent OS spec is linked or created when needed.',
                  '- [ ] Implementation follows project standards.',
                  '- [ ] Tests or manual validation are completed.',
                  '- [ ] PR is reviewed before merge.',
                  '',
                  '## Links',
                  '',
                  '- PR: created automatically after branch push.',
                ].join('\n'),
              });
              issue = createdIssue.data;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
            });

            const title = `${readableTitle}`;
            const body = [
              '## Summary',
              '',
              `- Automated PR for branch \`${head}\`.`,
              `- Closes #${issue.number}`,
              '',
              '## Why',
              '',
              '- Keep work on short-lived branches and merge manually after review.',
              '',
              '## Changes',
              '',
              '- See commit diff for details.',
              '',
              '## Validation',
              '',
              '- [ ] Backend tests pass',
              '- [ ] Frontend build passes',
              '- [ ] Manual verification completed where relevant',
              '',
              '## Agent OS',
              '',
              '- Spec:',
              '- Standards:',
              '',
              '## Notes',
              '',
              '- This PR was opened automatically by GitHub Actions.',
              '- Merge remains manual.',
            ].join('\n');

            let pr;
            if (existing.data.length > 0) {
              pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body,
                maintainer_can_modify: true,
              });
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
                draft: true,
                maintainer_can_modify: true,
              });
              pr = created.data;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                '## Goal',
                '',
                `Track work for branch \`${head}\`.`,
                '',
                '## Checklist',
                '',
                '- [ ] Agent OS spec is linked or created when needed.',
                '- [ ] Implementation follows project standards.',
                '- [ ] Tests or manual validation are completed.',
                '- [ ] PR is reviewed before merge.',
                '',
                '## Links',
                '',
                `- PR: #${pr.number}`,
              ].join('\n'),
            });

            core.setOutput('number', pr.number);
            core.setOutput('url', pr.html_url);
            core.setOutput('issue_number', issue.number);

      - name: Add bot review comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const head = context.ref.replace('refs/heads/', '');

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const fileList = files
              .slice(0, 40)
              .map((file) => `- \`${file.filename}\` (+${file.additions}/-${file.deletions})`)
              .join('\n');

            const body = [
              `## Review: ${head}`,
              '',
              `Coordinator verification for PR #${pull_number} and issue #${issue_number}:`,
              '',
              '- [ ] PR has a focused branch and commit scope.',
              '- [ ] Agent OS spec is referenced when implementation work is included.',
              '- [ ] Backend changes follow `backend/spring` and `api/rest` standards.',
              '- [ ] Frontend changes follow `frontend/react` standards.',
              '- [ ] Tests or manual validation are documented.',
              '- [ ] No secrets, local storage files, build outputs, or audio files are included.',
              '',
              '### Changed Files',
              '',
              fileList || '- No files detected.',
              '',
              '> This is an automated checklist review. Final review and merge remain manual.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body,
            });
