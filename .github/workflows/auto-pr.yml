name: Auto PR

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Open or update PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or update pull request
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';
            const issueLabel = 'auto-pr';
            const branchLabel = `branch:${head}`;
            const issueMatch = head.match(/^(feature|fix|chore|docs|refactor|test)\/(\d+)[-_\/].+/);
            const linkedIssueNumber = issueMatch ? Number(issueMatch[2]) : null;
            const readableTitle = head
              .replace(/^(feature|fix|chore|docs|refactor|test)\//, '')
              .replace(/^\d+[-_\/]/, '')
              .replace(/[-_]+/g, ' ')
              .replace(/\b\w/g, (char) => char.toUpperCase());

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              }
            }

            await ensureLabel(issueLabel, '6f42c1', 'Created or managed by the automatic PR workflow');
            await ensureLabel(branchLabel, 'bfd4f2', `Tracks work for ${head}`);

            let issue;
            if (linkedIssueNumber) {
              const existingIssue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: linkedIssueNumber,
              });
              issue = existingIssue.data;

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: linkedIssueNumber,
                labels: [issueLabel, branchLabel],
              });
            } else {
              const issues = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: branchLabel,
                per_page: 10,
              });

              issue = issues.data.find((item) => !item.pull_request);
            }

            if (!issue || issue.pull_request) {
              const createdIssue = await github.rest.issues.create({
                owner,
                repo,
                title: readableTitle,
                labels: [issueLabel, branchLabel],
                body: [
                  '## 목표',
                  '',
                  `\`${head}\` 브랜치 작업을 추적합니다.`,
                  '',
                  linkedIssueNumber
                    ? `요청된 이슈 #${linkedIssueNumber}를 추적 이슈로 사용할 수 없어 fallback 이슈를 생성했습니다.`
                    : '브랜치명에 이슈 번호가 없어 자동으로 생성된 추적 이슈입니다.',
                  '',
                  '## 체크리스트',
                  '',
                  '- [ ] 필요한 경우 Agent OS spec이 연결되었거나 생성되었습니다.',
                  '- [ ] 구현이 프로젝트 standards를 따릅니다.',
                  '- [ ] 테스트 또는 수동 검증이 완료되었습니다.',
                  '- [ ] merge 전에 PR 리뷰가 완료되었습니다.',
                  '',
                  '## 링크',
                  '',
                  '- PR: 브랜치 push 이후 자동 생성됩니다.',
                ].join('\n'),
              });
              issue = createdIssue.data;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
            });

            const title = `${readableTitle}`;
            const body = [
              '## 요약',
              '',
              `- \`${head}\` 브랜치에 대해 자동 생성된 PR입니다.`,
              `- Closes #${issue.number}`,
              '',
              '## 배경',
              '',
              '- 짧은 작업 브랜치에서 변경을 진행하고, 리뷰 후 수동으로 merge하기 위한 PR입니다.',
              '',
              '## 변경 사항',
              '',
              '- 자세한 내용은 commit diff를 확인합니다.',
              '',
              '## 검증',
              '',
              '- [ ] 백엔드 테스트 통과',
              '- [ ] 프론트엔드 빌드 통과',
              '- [ ] 필요한 수동 검증 완료',
              '',
              '## Agent OS',
              '',
              '- Spec:',
              '- Standards:',
              '',
              '## 메모',
              '',
              '- 이 PR은 GitHub Actions가 자동으로 열었습니다.',
              '- merge는 수동으로 진행합니다.',
            ].join('\n');

            let pr;
            if (existing.data.length > 0) {
              pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body,
              });
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
                draft: true,
                maintainer_can_modify: true,
              });
              pr = created.data;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                '## 목표',
                '',
                `\`${head}\` 브랜치 작업을 추적합니다.`,
                '',
                linkedIssueNumber
                  ? `이 브랜치는 이슈 #${linkedIssueNumber}와 연결되어 있습니다.`
                  : '브랜치명에 이슈 번호가 없어 자동으로 생성된 추적 이슈입니다.',
                '',
                '## 체크리스트',
                '',
                '- [ ] 필요한 경우 Agent OS spec이 연결되었거나 생성되었습니다.',
                '- [ ] 구현이 프로젝트 standards를 따릅니다.',
                '- [ ] 테스트 또는 수동 검증이 완료되었습니다.',
                '- [ ] merge 전에 PR 리뷰가 완료되었습니다.',
                '',
                '## 링크',
                '',
                `- PR: #${pr.number}`,
              ].join('\n'),
            });

            core.setOutput('number', pr.number);
            core.setOutput('url', pr.html_url);
            core.setOutput('issue_number', issue.number);

      - name: Add bot review comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue_number }}
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const head = context.ref.replace('refs/heads/', '');

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const fileList = files
              .slice(0, 40)
              .map((file) => `- \`${file.filename}\` (+${file.additions}/-${file.deletions})`)
              .join('\n');

            const body = [
              `## 리뷰: ${head}`,
              '',
              `PR #${pull_number} / 이슈 #${issue_number} 자동 검증 결과입니다.`,
              '',
              '- [ ] PR 브랜치와 커밋 범위가 명확합니다.',
              '- [ ] 구현 작업이 포함된 경우 Agent OS spec이 참조되었습니다.',
              '- [ ] 백엔드 변경은 `backend/spring`, `api/rest` standards를 따릅니다.',
              '- [ ] 프론트엔드 변경은 `frontend/react` standards를 따릅니다.',
              '- [ ] 테스트 또는 수동 검증 내용이 문서화되었습니다.',
              '- [ ] secret, 로컬 저장 파일, 빌드 산출물, 오디오 파일이 포함되지 않았습니다.',
              '',
              '### 변경 파일',
              '',
              fileList || '- No files detected.',
              '',
              '> 이 코멘트는 자동 체크리스트 리뷰입니다. 최종 리뷰와 merge는 수동으로 진행합니다.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body,
            });
