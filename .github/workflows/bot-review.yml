name: Bot Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review checklist
    runs-on: ubuntu-latest

    steps:
      - name: Add review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.ref;
            const marker = `<!-- voys-auto-review:${head} -->`;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const hasAgentSpec = files.some((file) => file.filename.startsWith('agent-os/specs/'));
            const hasBackend = files.some((file) => file.filename.startsWith('backend/'));
            const hasFrontend = files.some((file) => file.filename.startsWith('frontend/'));
            const hasWorkflow = files.some((file) => file.filename.startsWith('.github/workflows/'));
            const hasDocs = files.some((file) =>
              file.filename.endsWith('.md') || file.filename.startsWith('agent-os/')
            );
            const hasDependencyChange = files.some((file) =>
              ['backend/build.gradle', 'backend/settings.gradle', 'frontend/package.json', 'frontend/package-lock.json'].includes(file.filename)
            );
            const hasSecurityChange = files.some((file) =>
              file.filename.toLowerCase().includes('security') ||
              file.filename.toLowerCase().includes('auth') ||
              file.filename.includes('SecurityConfig')
            );
            const hasStorageChange = files.some((file) =>
              file.filename.toLowerCase().includes('storage') ||
              file.filename.toLowerCase().includes('upload') ||
              file.filename.toLowerCase().includes('audio')
            );
            const largeFiles = files.filter((file) => file.additions + file.deletions >= 400);
            const riskyFiles = files.filter((file) =>
              (file.filename.includes('.env') && file.filename !== '.env.example') ||
              file.filename.toLowerCase().includes('secret') ||
              file.filename.toLowerCase().includes('token') ||
              file.filename.toLowerCase().includes('credential')
            );

            const findings = [];
            const reviewFocus = [];
            const validationHints = [];

            if ((hasBackend || hasFrontend) && !hasAgentSpec) {
              findings.push('- Application files changed without an Agent OS spec change. Confirm the PR body explains why no spec update is needed.');
            }
            if (riskyFiles.length > 0) {
              findings.push(`- Files that may contain secrets or credentials changed: ${riskyFiles.map((file) => `\`${file.filename}\``).join(', ')}`);
            }
            if (hasWorkflow) {
              findings.push('- GitHub workflow files changed. Review permissions, triggers, token usage, and duplicate run risk carefully.');
            }
            if (largeFiles.length > 0) {
              findings.push(`- Large file changes detected. Consider whether the PR should be split: ${largeFiles.map((file) => `\`${file.filename}\``).join(', ')}`);
            }

            if (hasBackend) {
              reviewFocus.push('- Backend: API contracts, validation, error responses, transaction boundaries, and test coverage.');
              validationHints.push('- Backend tests or CI Backend result.');
            }
            if (hasFrontend) {
              reviewFocus.push('- Frontend: API credentials, loading/error states, accessibility, responsive layout, and build output.');
              validationHints.push('- Frontend tests/build or CI Frontend result.');
            }
            if (hasSecurityChange) {
              reviewFocus.push('- Security/auth: session cookies, CSRF/CORS, protected API access, and failure responses.');
            }
            if (hasStorageChange) {
              reviewFocus.push('- Storage/audio: file size limits, MIME validation, path exposure prevention, and cleanup after failure.');
            }
            if (hasDependencyChange) {
              reviewFocus.push('- Dependencies: lockfile consistency, license/security impact, and CI cache behavior.');
            }
            if (hasDocs && !hasBackend && !hasFrontend) {
              reviewFocus.push('- Docs: commands, paths, and described workflows should match the current repository.');
            }
            if (hasWorkflow) {
              validationHints.push('- Follow-up GitHub Actions run after workflow changes land.');
            }

            const changedFiles = files
              .slice(0, 30)
              .map((file) => `- \`${file.filename}\` (${file.status}, +${file.additions}/-${file.deletions})`)
              .join('\n');

            const body = [
              marker,
              `## Automated Review Checklist: ${head}`,
              '',
              '### Findings',
              '',
              findings.length > 0 ? findings.join('\n') : '- No blocking issue was detected by the checklist rules.',
              '',
              '### Review Focus',
              '',
              reviewFocus.length > 0 ? reviewFocus.join('\n') : '- Confirm the diff matches the linked issue and PR summary.',
              '',
              '### Validation Hints',
              '',
              validationHints.length > 0 ? validationHints.join('\n') : '- Add the smallest useful validation result to the PR body.',
              '',
              '### Changed Files',
              '',
              changedFiles || '- No changed files were found.',
              '',
              '> This is a checklist-style automated review, not an approval.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });

            for (const comment of comments) {
              if (comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body,
            });
