name: Start Work

on:
  workflow_dispatch:
    inputs:
      type:
        description: "작업 유형"
        required: true
        default: "feature"
        type: choice
        options:
          - feature
          - fix
          - chore
          - docs
          - refactor
          - test
      title:
        description: "이슈 제목"
        required: true
        type: string
      slug:
        description: "브랜치 slug, 예: session-auth"
        required: true
        type: string
      body:
        description: "이슈 본문"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  create-issue-and-branch:
    name: Create issue and branch
    runs-on: ubuntu-latest

    steps:
      - name: Create issue and branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const type = core.getInput('type');
            const title = core.getInput('title');
            const slugInput = core.getInput('slug');
            const bodyInput = core.getInput('body');

            const typeLabels = {
              feature: '기능',
              fix: '수정',
              chore: '작업',
              docs: '문서',
              refactor: '리팩터링',
              test: '테스트',
            };

            const slug = slugInput
              .trim()
              .toLowerCase()
              .replace(/[^a-z0-9가-힣._-]+/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '');

            if (!slug) {
              core.setFailed('브랜치 slug가 비어 있습니다.');
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: type });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner,
                repo,
                name: type,
                color: '2f81f7',
                description: `${typeLabels[type] || '작업'} 작업`,
              });
            }

            const labels = [type];
            const issueBody = bodyInput?.trim()
              ? bodyInput
              : [
                  '## 목표',
                  '',
                  title,
                  '',
                  '## 체크리스트',
                  '',
                  '- [ ] Agent OS spec 작성',
                  '- [ ] 구현',
                  '- [ ] 테스트 또는 수동 검증',
                  '- [ ] PR 리뷰',
                ].join('\n');

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title,
              body: issueBody,
              labels,
            });

            const issueNumber = issue.data.number;
            const branchName = `${type}/${issueNumber}-${slug}`;

            const mainRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branchName}`,
              sha: mainRef.data.object.sha,
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                issueBody,
                '',
                '## 작업 브랜치',
                '',
                `- \`${branchName}\``,
                '',
                '## 다음 단계',
                '',
                '1. 로컬에서 `main`을 최신화합니다.',
                `2. \`${branchName}\` 브랜치로 전환합니다.`,
                '3. Agent OS spec을 작성하고 구현을 진행합니다.',
                '4. push하면 자동 PR이 생성됩니다.',
              ].join('\n'),
            });

            core.summary
              .addHeading(`${typeLabels[type] || '작업'} 시작`)
              .addList([
                `이슈: #${issueNumber} ${title}`,
                `브랜치: ${branchName}`,
                `이슈 URL: ${issue.data.html_url}`,
              ])
              .write();
