name: Start Work

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Work type"
        required: true
        default: "feature"
        type: choice
        options:
          - feature
          - fix
          - chore
          - docs
          - refactor
          - test
      title:
        description: "Issue title"
        required: true
        type: string
      slug:
        description: "Branch slug, for example session-auth"
        required: true
        type: string
      body:
        description: "Issue body"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  create-issue-and-branch:
    name: Create issue and branch
    runs-on: ubuntu-latest

    steps:
      - name: Create issue
        id: issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VOYS_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const inputs = context.payload.inputs || {};
            const type = inputs.type || 'feature';
            const title = inputs.title || '';
            const slugInput = inputs.slug || '';
            const bodyInput = inputs.body || '';

            const typeLabels = {
              feature: 'Feature',
              fix: 'Fix',
              chore: 'Chore',
              docs: 'Docs',
              refactor: 'Refactor',
              test: 'Test',
            };

            const slug = slugInput
              .trim()
              .toLowerCase()
              .replace(/[^a-z0-9_-]+/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '');

            if (!slug) {
              core.setFailed('Branch slug is empty after normalization.');
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: type });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: type,
                color: '2f81f7',
                description: `${typeLabels[type] || 'Work'} work`,
              });
            }

            const issueBody = bodyInput?.trim()
              ? bodyInput
              : [
                  '## Goal',
                  '',
                  title,
                  '',
                  '## Checklist',
                  '',
                  '- [ ] Agent OS spec written or confirmed unnecessary.',
                  '- [ ] Implementation completed.',
                  '- [ ] Tests or manual validation completed.',
                  '- [ ] PR reviewed before merge.',
                ].join('\n');

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title,
              body: issueBody,
              labels: [type],
            });

            const issueNumber = issue.data.number;
            const branchName = `${type}/${issueNumber}-${slug}`;

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_url', issue.data.html_url);
            core.setOutput('issue_body', issueBody);
            core.setOutput('branch_name', branchName);
            core.setOutput('title', title);
            core.setOutput('type_label', typeLabels[type] || 'Work');

      - name: Create branch and update issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          ISSUE_URL: ${{ steps.issue.outputs.issue_url }}
          ISSUE_BODY: ${{ steps.issue.outputs.issue_body }}
          BRANCH_NAME: ${{ steps.issue.outputs.branch_name }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          TYPE_LABEL: ${{ steps.issue.outputs.type_label }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueUrl = process.env.ISSUE_URL;
            const branchName = process.env.BRANCH_NAME;
            const title = process.env.ISSUE_TITLE;
            const typeLabel = process.env.TYPE_LABEL;
            const issueBody = process.env.ISSUE_BODY;

            const mainRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branchName}`,
              sha: mainRef.data.object.sha,
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                issueBody,
                '',
                '## Work Branch',
                '',
                `- \`${branchName}\``,
                '',
                '## Next Steps',
                '',
                '1. Sync local `main`.',
                `2. Switch to \`${branchName}\`.`,
                '3. Write or confirm the Agent OS spec, then implement.',
                '4. Push the branch to open or update the PR.',
              ].join('\n'),
            });

            core.summary
              .addHeading(`${typeLabel} started`)
              .addList([
                `Issue: #${issueNumber} ${title}`,
                `Branch: ${branchName}`,
                `Issue URL: ${issueUrl}`,
              ])
              .write();
