services:
  postgres:
    image: postgres:16-alpine
    container_name: voys-postgres
    environment:
      POSTGRES_DB: voys
      POSTGRES_USER: voys
      POSTGRES_PASSWORD: voys
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voys -d voys"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

